interface:
  display_name: "my-codex-workfolws"
  short_description: "Codex plans first, dispatches visible cc, then visible cx repair and cx2 review before master integration."
  default_prompt: "Use $my-codex-workfolws when Codex should plan a task, keep tg-agent-gateway cc2 reserved as the default read-only observer, select implementation workers from clean idle cc3-cc10 unless the user explicitly names cc2 or disables observer coverage, launch implementation Claude Code in visible terminals, and launch cc2 to observe other cc worker sessions when available. Any explicit cx branch/session start must use a long-lived visible Windows Terminal + tmux interactive Codex CLI, just like cc; pass the prompt as Codex's initial PROMPT argument rather than multi-line pasting into the TUI, and do not use codex exec/headless/background shell unless explicitly requested. If cc fails, do one-shot fallback to the first clean idle cx3/cx4/cx5 repair worker in a visible Codex terminal, then route the final candidate to cx2 review gate in a visible Codex terminal. After cx2 pass, apply/verify in target checkout and refresh runtime as needed. Keep tmux session close gates unchanged, and do not push unless the user explicitly asks."
policy:
  allow_implicit_invocation: true
